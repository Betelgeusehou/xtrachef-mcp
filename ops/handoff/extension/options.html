<!doctype html>
<html><head><meta charset="utf-8"><title>Ops handoff options</title>
<style>body{font:14px system-ui,sans-serif;max-width:560px;margin:24px auto;padding:0 16px;color:#222}label{display:block;margin:16px 0 4px;font-weight:600}input{width:100%;box-sizing:border-box;padding:8px;font:inherit}button{margin-top:16px;padding:8px 14px;font:inherit}#msg{margin-top:12px;white-space:pre-line}small{color:#666}</style>
</head><body>
<h2>Ops session handoff</h2>
<label for="base">Server URL (with the secret path)</label>
<input id="base" placeholder="https://your-service.up.railway.app/&lt;XTRACHEF_MCP_SECRET&gt;" autocomplete="off">
<small>The same URL as the MCP endpoint, without the trailing /mcp.</small>
<label for="token">Handoff token (OPS_HANDOFF_TOKEN)</label>
<input id="token" type="password" placeholder="paste OPS_HANDOFF_TOKEN" autocomplete="off">
<button id="save">Save</button> <button id="test">Save and push now</button>
<div id="msg"></div>
<script type="module" src="options.js"></script>
</body></html>
